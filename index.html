<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Кэшбэк рядом">
  <meta name="theme-color" content="#1C1C1E">
  <title>Кэшбэк на районе — прототип</title>

  <!-- «На экран Домой»: манифест для Android, apple-touch-icon для iOS (iOS не берёт иконки из манифеста) -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/app/icon-180.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/app/icon-32.png">

  <!-- Тема до загрузки стилей, чтобы не было вспышки -->
  <script>
    if (new URLSearchParams(location.search).get('theme') === 'light') {
      document.documentElement.dataset.theme = 'light';
      document.querySelector('meta[name="theme-color"]').content = '#FFFFFF';
    }
  </script>

  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="vendor/markercluster/MarkerCluster.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/frame.css">
  <link rel="stylesheet" href="css/map.css">
  <link rel="stylesheet" href="css/sheet.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/screens-store.css">
  <link rel="stylesheet" href="css/screens-offer.css">
</head>
<body>
  <div class="stage">
    <div class="device" id="device">
      <div class="app" id="app">
        <!-- Карта на весь экран под шторкой -->
        <div class="map" id="map"></div>

        <!-- Фейковый статус-бар (только в рамке телефона на десктопе) -->
        <div class="statusbar" aria-hidden="true">
          <span class="statusbar__time">9:41</span>
          <span class="statusbar__island"></span>
          <span class="statusbar__icons">
            <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
            <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 2.5c2.3 0 4.4.9 6 2.4l1.1-1.2A10.2 10.2 0 0 0 8 .8 10.2 10.2 0 0 0 .9 3.7L2 4.9a8.5 8.5 0 0 1 6-2.4zm0 3.4c1.4 0 2.6.5 3.6 1.4l1.1-1.2A7 7 0 0 0 8 4.2a7 7 0 0 0-4.7 1.9l1.1 1.2c1-.9 2.2-1.4 3.6-1.4zm0 3.3c.5 0 1 .2 1.4.6L8 11.3 6.6 9.8c.4-.4.9-.6 1.4-.6z"/></svg>
            <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2"/><path d="M25 4.5v4a2 2 0 0 0 0-4z" opacity=".4"/></svg>
          </span>
        </div>

        <!-- Шапка раздела -->
        <header class="app-header">
          <button class="app-header__back" type="button" id="header-back" aria-label="Назад">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
          </button>
          <h1 class="app-header__title">Кэшбэк на районе</h1>
        </header>

        <!-- Элементы поверх карты: плашки, кнопки зума и геолокации -->
        <div class="map-ui" id="map-ui"></div>

        <!-- Шторка: ручка + экраны -->
        <div class="sheet" id="sheet" data-pos="mid">
          <div class="sheet__grab" data-sheet-drag><span class="sheet__handle"></span></div>
          <div class="sheet__screens" id="sheet-screens"></div>
        </div>

        <!-- Плавающие кнопки «Карта» / «Список» -->
        <div class="fab-layer" id="fab"></div>

        <!-- Полноэкранные экраны и нижние модальные окна -->
        <div class="pages" id="pages"></div>
        <div class="modals" id="modals"></div>
        <div class="toasts" id="toasts" aria-live="polite"></div>
      </div>
    </div>
    <p class="stage__caption">Прототип · данные вымышленные</p>
  </div>

  <!-- Dev-панель (?dev=1) -->
  <aside class="dev-panel" id="dev-panel" hidden></aside>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="vendor/markercluster/leaflet.markercluster.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
